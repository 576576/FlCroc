name: fl_croc
description: "A Flutter GUI for croc - easily and securely transfer files between computers"
publish_to: 'none'

version: 1.2.4+110

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_ui: ^1.1.2
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  intl: ^0.20.3
  material_ui: ^1.6.0
  path_provider: ^2.1.5
  path: ^1.9.1
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.1
  file_picker: ^13.1.0
  shared_preferences: ^2.3.5
  ffi: ^2.1.3
  downloadsfolder: ^1.2.0
  open_filex: ^4.7.0
  # fork 576576/flutter_toast 的 flcroc 分支：lib/fluttertoast.dart 的
  # package:flutter/material.dart 换成了 package:material_ui/material_ui.dart。
  # ref 必须是不可变的 tag —— pubspec.lock 被 .gitignore 忽略，仓库里没有别处记录
  # 上次 pub get 解到哪个 commit。
  fluttertoast:
    git:
      url: https://github.com/576576/flutter_toast.git
      ref: v10.0.2-flcroc.1
  share_receiver: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # 2.17 起要求 build >=5，而 json_serializable 6.14.1（6.x 最新）要 build ^4.0.4，
  # 所以这里卡在 2.16.x 是解析出来的上限，不是漏更新。
  build_runner: ^2.16.2
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  image_path: assets/images/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
  linux:
    generate: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/bundles/
