name: PR

# PR 阶段的把关：只跑质量门禁，不构建、不发布。
#
# 不配 paths-ignore：被跳过的 PR 一条 check 都没有，设成 required 会一直停在 pending。
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 质量门禁（复用 lint.yml）
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml
